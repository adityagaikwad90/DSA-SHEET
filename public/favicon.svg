<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="accentCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="30%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hex Shield -->
  <rect width="48" height="48" rx="12" fill="#0a0d14" />
  <rect width="48" height="48" rx="12" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />

  <!-- Outer Isometric Hexagon Grid -->
  <path d="M24 7L38 15V31L24 39L10 31V15L24 7Z" 
        stroke="url(#cyanIndigo)" 
        stroke-width="1.5" 
        stroke-linejoin="round" 
        opacity="0.4" />

  <!-- Isometric Facets -->
  <path d="M24 10L35 16.5L24 23L13 16.5L24 10Z" 
        fill="url(#emeraldGlow)" 
        fill-opacity="0.25" 
        stroke="url(#accentCore)" 
        stroke-width="1.75" 
        stroke-linejoin="round" />

  <path d="M13 16.5L24 23V36L13 29.5V16.5Z" 
        fill="url(#cyanIndigo)" 
        fill-opacity="0.3" 
        stroke="url(#cyanIndigo)" 
        stroke-width="1.75" 
        stroke-linejoin="round" />

  <path d="M24 23L35 16.5V29.5L24 36V23Z" 
        fill="url(#emeraldGlow)" 
        fill-opacity="0.18" 
        stroke="url(#emeraldGlow)" 
        stroke-width="1.75" 
        stroke-linejoin="round" />

  <!-- Inner Graph Structure -->
  <path d="M24 14L18 20M24 14L30 20M18 20L18 28M30 20L30 28M18 28L24 32M30 28L24 32" 
        stroke="#6ee7b7" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.95" 
        filter="url(#glowFilter)" />

  <circle cx="24" cy="14" r="2.5" fill="#ffffff" stroke="#10b981" stroke-width="1" />
  <circle cx="18" cy="20" r="2.2" fill="#38bdf8" />
  <circle cx="30" cy="20" r="2.2" fill="#34d399" />
  <circle cx="24" cy="23" r="2.2" fill="#ffffff" filter="url(#glowFilter)" />
  <circle cx="18" cy="28" r="1.8" fill="#818cf8" />
  <circle cx="30" cy="28" r="1.8" fill="#38bdf8" />
  <circle cx="24" cy="32" r="2.2" fill="#10b981" stroke="#ffffff" stroke-width="0.75" />
</svg>

