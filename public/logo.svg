<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="accentCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="1" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Hex Base -->
  <rect width="48" height="48" rx="12" fill="#0d121f" />
  <rect width="48" height="48" rx="12" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Outer Isometric Hexagon Grid (Data Lattice) -->
  <path d="M24 7L38 15V31L24 39L10 31V15L24 7Z" 
        stroke="url(#cyanIndigo)" 
        stroke-width="1.5" 
        stroke-linejoin="round" 
        opacity="0.4" />

  <!-- Three Isometric Facets of Data Cube / Structure -->
  <!-- Top Facet -->
  <path d="M24 10L35 16.5L24 23L13 16.5L24 10Z" 
        fill="url(#emeraldGlow)" 
        fill-opacity="0.25" 
        stroke="url(#accentCore)" 
        stroke-width="1.75" 
        stroke-linejoin="round" />

  <!-- Left Facet -->
  <path d="M13 16.5L24 23V36L13 29.5V16.5Z" 
        fill="url(#cyanIndigo)" 
        fill-opacity="0.3" 
        stroke="url(#cyanIndigo)" 
        stroke-width="1.75" 
        stroke-linejoin="round" />

  <!-- Right Facet -->
  <path d="M24 23L35 16.5V29.5L24 36V23Z" 
        fill="url(#emeraldGlow)" 
        fill-opacity="0.18" 
        stroke="url(#emeraldGlow)" 
        stroke-width="1.75" 
        stroke-linejoin="round" />

  <!-- Inner Interconnected Binary Tree / Graph Structure -->
  <!-- Graph Edges -->
  <path d="M24 14L18 20M24 14L30 20M18 20L18 28M30 20L30 28M18 28L24 32M30 28L24 32" 
        stroke="#6ee7b7" 
        stroke-width="1.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.9" 
        filter="url(#glowFilter)" />

  <!-- Graph Nodes (Circles with Pulse Glow) -->
  <!-- Root Node -->
  <circle cx="24" cy="14" r="2.5" fill="#ffffff" stroke="#10b981" stroke-width="1" />
  
  <!-- Left Child -->
  <circle cx="18" cy="20" r="2.2" fill="#38bdf8" />
  
  <!-- Right Child -->
  <circle cx="30" cy="20" r="2.2" fill="#34d399" />

  <!-- Center Core Node -->
  <circle cx="24" cy="23" r="2.2" fill="#ffffff" filter="url(#glowFilter)" />

  <!-- Bottom Sub-nodes -->
  <circle cx="18" cy="28" r="1.8" fill="#818cf8" />
  <circle cx="30" cy="28" r="1.8" fill="#38bdf8" />
  
  <!-- Terminal Target Node -->
  <circle cx="24" cy="32" r="2.2" fill="#10b981" stroke="#ffffff" stroke-width="0.75" />
</svg>

